name: Nightly Health

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-drift:
    name: Check for Available Upgrades
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report outdated dependencies
        run: npm outdated || true

      - name: Fail on a major update to a build-critical package
        run: |
          set -euo pipefail
          outdated="$(npm outdated --json || true)"
          echo "$outdated"
          blocking="$(echo "$outdated" | node -e "
            let raw = '';
            process.stdin.on('data', (chunk) => (raw += chunk));
            process.stdin.on('end', () => {
              let data = {};
              try { data = JSON.parse(raw || '{}'); } catch { data = {}; }
              const critical = ['vite', 'esbuild', 'react', 'react-dom', 'react-router-dom', '@supabase/supabase-js'];
              const majors = [];
              for (const [name, info] of Object.entries(data)) {
                if (!critical.includes(name)) continue;
                const current = String(info.current || '').replace(/^[^0-9]*/, '').split('.')[0];
                const next = String(info.wanted || info.latest || '').replace(/^[^0-9]*/, '').split('.')[0];
                if (next && current && Number(next) > Number(current)) {
                  majors.push(name + ' ' + current + ' -> ' + next);
                }
              }
              console.log(majors.join('\n'));
            });
          ")"
          if [ -n "$blocking" ]; then
            echo "::error::Major upgrades available for build-critical packages:"
            echo "$blocking"
            exit 1
          fi
          echo "No blocking major upgrades pending."

  build-stability:
    name: Rebuild and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}

      - name: Verify build output
        run: npm run verify:build
